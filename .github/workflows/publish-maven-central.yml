name: Publish to Maven Central

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: maven-central-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Upload release to Central Portal
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Verify tag matches publication version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          tag_version="${RELEASE_TAG#v}"
          publication_version="$(sed -nE 's/.*coordinates\("[^"]+", "[^"]+", "([^"]+)"\).*/\1/p' picker/build.gradle.kts)"

          if [[ -z "$publication_version" || "$tag_version" != "$publication_version" ]]; then
            echo "Tag version ($tag_version) must match picker/build.gradle.kts ($publication_version)." >&2
            exit 1
          fi

      - name: Test release
        run: ./gradlew :picker:testDebugUnitTest :picker:assembleRelease

      - name: Upload to Central Portal
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        shell: bash
        run: |
          for secret_name in \
            ORG_GRADLE_PROJECT_mavenCentralUsername \
            ORG_GRADLE_PROJECT_mavenCentralPassword \
            ORG_GRADLE_PROJECT_signingInMemoryKey \
            ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Required GitHub Actions secret is missing: $secret_name" >&2
              exit 1
            fi
          done

          ./gradlew :picker:publishToMavenCentral
